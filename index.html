<!DOCTYPE html>
<html lang="id" data-mode="light" data-accent="blue" data-glass="frosted" data-icon-style="color">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Taman Belajar</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 1. PECAHAN CSS -->
  <link rel="stylesheet" href="./css/01-base-glass.css" />
  <link rel="stylesheet" href="./css/02-components.css" />
  <link rel="stylesheet" href="./css/03-themes.css" />
</head>
<body class="liquid-mesh-bg text-slate-800 antialiased">

  <!-- WADAH SUNTIKAN UI -->
  <div id="slot-icons"></div>
  <div id="slot-toast-confirm"></div>

  <div id="app-root" class="h-full max-w-md mx-auto flex flex-col relative overflow-hidden">
    <div id="slot-login"></div>
    <div id="slot-header"></div>
    <main id="main-scroll-area" onscroll="onMainScrollRefract(this)" class="flex-1 overflow-y-auto px-4 pt-1 pb-28 space-y-3.5"></main>
    <div id="slot-dock"></div>
  </div>

  <div id="slot-modals"></div>

  <!-- 2. VERSI & CORE -->
  <script src="./js/core/version.js"></script>
  <script src="./js/core/firebase-sync.js"></script>
  <script src="./js/core/auth.js"></script>

  <!-- 3. PECAHAN TAMPILAN (UI) -->
  <script src="./js/ui/ui-icons.js"></script>
  <script src="./js/ui/ui-login.js"></script>
  <script src="./js/ui/ui-header-dock.js"></script>
  <script src="./js/ui/ui-views.js"></script>
  <script src="./js/ui/ui-modals.js"></script>

  <!-- 4. MODUL LOGIKA FITUR -->
  <script src="./js/modules/murid.js"></script>
  <script src="./js/modules/absensi.js"></script>
  <script src="./js/modules/nilai.js"></script>
  <script src="./js/modules/dokumentasi.js"></script>
  <script src="./js/modules/laporan-pdf.js"></script>
  <script src="./js/modules/tema.js"></script>
  <script src="./js/modules/app-shell.js"></script>

</html>
